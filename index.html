<!DOCTYPE html>
<html lang="gu">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>શ્રદ્ધાંજલિ કાર્ડ મેકર - Shardhajali Maker</title>

    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet"
        integrity="sha384-QWTKZyjpPEjISv5WaRU9OFeRpok6YctnYmDr5pNlyT2bRjXh0JMhjY6hW+ALEwIH" crossorigin="anonymous">
    <!-- Google Fonts for Gujarati and Devanagari (Hindi) script support -->
    <link
        href="https://fonts.googleapis.com/css2?family=Noto+Sans+Gujarati:wght@400;500;600;700;800;900&family=Noto+Sans+Devanagari:wght@400;500;600;700;800;900&display=swap"
        rel="stylesheet">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="./assets/css/style.css">
</head>

<body>
    <div class="container-fluid py-4">
        <h1 class="text-center mb-4 text-brown">શ્રદ્ધાંજલિ કાર્ડ મેકર</h1>

        <div class="row g-4">
            <!-- Controls Column -->
            <div class="col-lg-6">
                <div class="card shadow-sm p-4 h-100">
                    <h2 class="card-title text-brown mb-3">કાર્ડ સેટિંગ</h2>
                    <div class="controls-form">

                        <!-- Event Type Selection -->
                        <div class="mb-3">
                            <label for="eventType" class="form-label fw-bold text-brown">કાર્ડ પ્રકાર પસંદ કરો:</label>
                            <select id="eventType" class="form-select">
                                <option value="besanu">બેસણું</option>
                                <option value="termu">તેરમું</option>
                                <option value="utarkriya">ઉત્તરક્રિયા</option>
                                <option value="chhamhi">છમ્હી</option>
                                <option value="punyatithi" selected>પુણ્યતિથિ</option>
                                <option value="varsi">વર્ષી / વાર્ષિક શ્રાદ્ધ</option>
                                <option value="shradhanjali">શ્રદ્ધાંજલિ</option>
                            </select>
                        </div>

                        <!-- Language Selection -->
                        <div class="mb-3">
                            <label for="inputLanguage" class="form-label fw-bold text-brown">ભાષા:</label>
                            <select id="inputLanguage" class="form-select">
                                <option value="gujarati" selected>ગુજરાતી</option>
                                <!-- <option value="hindi">हिंदी</option>
                                <option value="english">English</option> -->
                            </select>
                        </div>

                        <!-- Theme Selection -->
                        <div class="mb-4">
                            <label class="form-label fw-bold text-brown d-block">થીમ પસંદ કરો:</label>
                            <div class="theme-selector d-flex flex-wrap gap-2">
                                <div class="theme-option active" data-theme="theme1"
                                    style="background-image: url('./assets/img/theme1-thumb.jpg');"></div>
                                <div class="theme-option" data-theme="theme2"
                                    style="background-image: url('./assets/img/theme2-thumb.jpg');"></div>
                                <div class="theme-option" data-theme="theme3"
                                    style="background-image: url('./assets/img/theme3-thumb.jpg');"></div>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Main Title/Occasion Customization -->
                        <h3 class="h5 fw-bold text-brown mb-3">કાર્ડ શીર્ષક</h3>
                        <div class="d-flex gap-3 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="inbuiltTitle" name="titleOption"
                                    value="inbuilt" checked>
                                <label class="form-check-label" for="inbuiltTitle">તૈયાર શીર્ષક</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="customTitle" name="titleOption"
                                    value="custom">
                                <label class="form-check-label" for="customTitle">કસ્ટમ શીર્ષક</label>
                            </div>
                        </div>

                        <div id="inbuiltTitleOptions" class="mb-3">
                            <label for="predefinedOccasionTitle" class="form-label">તૈયાર શીર્ષક પસંદ કરો:</label>
                            <select id="predefinedOccasionTitle" class="form-select"></select>
                        </div>

                        <div id="customTitleInput" class="mb-3 hidden">
                            <label class="form-label">કસ્ટમ શીર્ષક લખો:</label>
                            <input type="text" id="customOccasionTitle_gujarati" class="form-control lang-input"
                                data-lang="gujarati" placeholder="ગુજરાતીમાં શીર્ષક લખો">
                            <input type="text" id="customOccasionTitle_hindi" class="form-control lang-input hidden"
                                data-lang="hindi" placeholder="हिंदी में शीर्षक लिखें">
                            <input type="text" id="customOccasionTitle_english" class="form-control lang-input hidden"
                                data-lang="english" placeholder="Enter title in English">
                        </div>

                        <div class="d-flex gap-3 align-items-center mb-3">
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">ફોન્ટ:</label>
                                <input type="range" class="form-range" id="occasionTitleFontSize" min="20" max="60"
                                    value="33" style="width:100px;">
                                <span id="occasionTitleFontSizeValue" class="small text-muted">33px</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">રંગ:</label>
                                <input type="color" class="form-control form-control-color" id="occasionTitleFontColor"
                                    value="#5a3d2b" style="width:35px;height:30px;padding:2px;">
                            </div>
                            <div class="form-check d-flex align-items-center gap-1 mb-0">
                                <input class="form-check-input" type="checkbox" id="occasionTitleBold" checked>
                                <label class="form-check-label small text-brown fw-bold"
                                    for="occasionTitleBold">B</label>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Deceased Details -->
                        <h3 class="h5 fw-bold text-brown mb-3">સ્વર્ગસ્થની માહિતી</h3>
                        <div class="mb-3">
                            <label class="form-label">સ્વર્ગસ્થનું નામ:</label>
                            <input type="text" id="deceasedName_gujarati" class="form-control lang-input"
                                data-lang="gujarati" value="સ્વ. રાજભાલાલ ઝવેરભાઈ સવાણી">
                            <input type="text" id="deceasedName_hindi" class="form-control lang-input hidden"
                                data-lang="hindi" value="स्व. राजभालाल झवेरभाई सवाणी">
                            <input type="text" id="deceasedName_english" class="form-control lang-input hidden"
                                data-lang="english" value="Late. Rajabhalal Zaverbhai Savani">
                        </div>

                        <div class="mb-3">
                            <label for="eventDate" class="form-label">તારીખ (DD.MM.YYYY):</label>
                            <input type="text" id="eventDate" class="form-control" value="15.10.2023"
                                placeholder="દા.ત., 15.10.2023">
                        </div>

                        <div class="mb-3">
                            <label class="form-label">સ્થળ:</label>
                            <input type="text" id="eventPlace_gujarati" class="form-control lang-input"
                                data-lang="gujarati" value="ગામ. વડિયા, પાલીતાણા">
                            <input type="text" id="eventPlace_hindi" class="form-control lang-input hidden"
                                data-lang="hindi" value="ग्राम. वडिया, पालिताणा">
                            <input type="text" id="eventPlace_english" class="form-control lang-input hidden"
                                data-lang="english" value="Village: Vadiya, Palitana">
                        </div>

                        <div class="d-flex gap-3 align-items-center mb-3">
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">ફોન્ટ:</label>
                                <input type="range" class="form-range" id="deceasedNameFontSize" min="16" max="40"
                                    value="23" style="width:100px;">
                                <span id="deceasedNameFontSizeValue" class="small text-muted">23px</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">રંગ:</label>
                                <input type="color" class="form-control form-control-color" id="deceasedNameFontColor"
                                    value="#5a3d2b" style="width:35px;height:30px;padding:2px;">
                            </div>
                            <div class="form-check d-flex align-items-center gap-1 mb-0">
                                <input class="form-check-input" type="checkbox" id="deceasedNameBold">
                                <label class="form-check-label small text-brown fw-bold"
                                    for="deceasedNameBold">B</label>
                            </div>
                        </div>

                        <div class="mb-4">
                            <label for="photoUpload" class="form-label">ફોટો અપલોડ કરો:</label>
                            <input type="file" id="photoUpload" class="form-control" accept="image/*">
                        </div>

                        <hr class="my-4">

                        <!-- Message Section -->
                        <h3 class="h5 fw-bold text-brown mb-3">શ્રદ્ધાંજલિ સંદેશ</h3>
                        <div class="mb-3">
                            <textarea id="messageText_gujarati" class="form-control lang-input" data-lang="gujarati"
                                rows="5" placeholder="ગુજરાતીમાં સંદેશ લખો (દરેક લાઇન અલગ સંદેશ)"></textarea>
                            <textarea id="messageText_hindi" class="form-control lang-input hidden" data-lang="hindi"
                                rows="5" placeholder="हिंदी में संदेश लिखें (प्रत्येक पंक्ति अलग संदेश)"></textarea>
                            <textarea id="messageText_english" class="form-control lang-input hidden"
                                data-lang="english" rows="5"
                                placeholder="Type messages in English (each line = separate message)"></textarea>
                        </div>
                        <div class="d-flex gap-3 align-items-center mb-3">
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">ફોન્ટ:</label>
                                <input type="range" class="form-range" id="messageFontSize" min="12" max="30" value="18"
                                    style="width:100px;">
                                <span id="messageFontSizeValue" class="small text-muted">18px</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">રંગ:</label>
                                <input type="color" class="form-control form-control-color" id="messageFontColor"
                                    value="#5a3d2b" style="width:35px;height:30px;padding:2px;">
                            </div>
                            <div class="form-check d-flex align-items-center gap-1 mb-0">
                                <input class="form-check-input" type="checkbox" id="messageBold">
                                <label class="form-check-label small text-brown fw-bold" for="messageBold">B</label>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Custom Sections ABOVE Family -->
                        <h3 class="h5 fw-bold text-brown mb-3">વધારાની વિગતો (કુટુંબ ઉપર)</h3>
                        <div id="upperCustomSectionsContainer" class="mb-3">
                            <!-- Upper sections dynamically rendered by JS -->
                        </div>
                        <button id="addUpperCustomSectionBtn" class="btn btn-outline-secondary btn-sm mb-3">+ વિભાગ
                            ઉમેરો (ઉપર)</button>

                        <hr class="my-4">

                        <!-- Family Section Customization -->
                        <h3 class="h5 fw-bold text-brown mb-3">કુટુંબની વિગતો</h3>

                        <!-- Family Layout Option -->
                        <div class="mb-3">
                            <label class="form-label fw-bold text-brown">કૉલમ લેઆઉટ:</label>
                            <div class="d-flex gap-3">
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="familyLayout1Col"
                                        name="familyLayout" value="1">
                                    <label class="form-check-label" for="familyLayout1Col">૧ કૉલમ</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="familyLayout2Col"
                                        name="familyLayout" value="2" checked>
                                    <label class="form-check-label" for="familyLayout2Col">૨ કૉલમ</label>
                                </div>
                                <div class="form-check">
                                    <input class="form-check-input" type="radio" id="familyLayoutAuto"
                                        name="familyLayout" value="auto">
                                    <label class="form-check-label" for="familyLayoutAuto">ઑટો</label>
                                </div>
                            </div>
                        </div>

                        <!-- Family Title Inbuilt/Custom -->
                        <div class="d-flex gap-3 mb-3">
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="inbuiltFamilyTitle"
                                    name="familyTitleOption" value="inbuilt" checked>
                                <label class="form-check-label" for="inbuiltFamilyTitle">તૈયાર કુટુંબ શીર્ષક</label>
                            </div>
                            <div class="form-check">
                                <input class="form-check-input" type="radio" id="customFamilyTitle"
                                    name="familyTitleOption" value="custom">
                                <label class="form-check-label" for="customFamilyTitle">કસ્ટમ કુટુંબ શીર્ષક</label>
                            </div>
                        </div>

                        <div id="inbuiltFamilyTitleOptions" class="mb-3">
                            <label for="predefinedFamilyTitle" class="form-label">તૈયાર કુટુંબ શીર્ષક:</label>
                            <select id="predefinedFamilyTitle" class="form-select"></select>
                        </div>

                        <div id="customFamilyTitleInput" class="mb-3 hidden">
                            <label class="form-label">કસ્ટમ કુટુંબ શીર્ષક:</label>
                            <input type="text" id="customFamilyTitle_gujarati" class="form-control lang-input"
                                data-lang="gujarati" placeholder="ગુજરાતીમાં કુટુંબ શીર્ષક">
                            <input type="text" id="customFamilyTitle_hindi" class="form-control lang-input hidden"
                                data-lang="hindi" placeholder="हिंदी में परिवार शीर्षक">
                            <input type="text" id="customFamilyTitle_english" class="form-control lang-input hidden"
                                data-lang="english" placeholder="Family title in English">
                        </div>

                        <div class="d-flex gap-3 align-items-center mb-3">
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">ફોન્ટ:</label>
                                <input type="range" class="form-range" id="familyTitleFontSize" min="14" max="30"
                                    value="20" style="width:100px;">
                                <span id="familyTitleFontSizeValue" class="small text-muted">20px</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">રંગ:</label>
                                <input type="color" class="form-control form-control-color" id="familyTitleFontColor"
                                    value="#5a3d2b" style="width:35px;height:30px;padding:2px;">
                            </div>
                            <div class="form-check d-flex align-items-center gap-1 mb-0">
                                <input class="form-check-input" type="checkbox" id="familyTitleBold" checked>
                                <label class="form-check-label small text-brown fw-bold" for="familyTitleBold">B</label>
                            </div>
                        </div>

                        <label class="form-label">કુટુંબ સભ્ય:</label>
                        <div id="familyNamesInputsContainer" class="mb-3">
                            <!-- Family members dynamically rendered by JS -->
                        </div>
                        <button id="addFamilyMemberBtn" class="btn btn-outline-secondary btn-sm mb-3">+ સભ્ય
                            ઉમેરો</button>

                        <div class="d-flex gap-3 align-items-center mb-3">
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">ફોન્ટ:</label>
                                <input type="range" class="form-range" id="familyNameFontSize" min="12" max="25"
                                    value="18" style="width:100px;">
                                <span id="familyNameFontSizeValue" class="small text-muted">18px</span>
                            </div>
                            <div class="d-flex align-items-center gap-1">
                                <label class="form-label small mb-0 text-brown">રંગ:</label>
                                <input type="color" class="form-control form-control-color" id="familyNameFontColor"
                                    value="#7a5f4c" style="width:35px;height:30px;padding:2px;">
                            </div>
                            <div class="form-check d-flex align-items-center gap-1 mb-0">
                                <input class="form-check-input" type="checkbox" id="familyNameBold">
                                <label class="form-check-label small text-brown fw-bold" for="familyNameBold">B</label>
                            </div>
                        </div>

                        <hr class="my-4">

                        <!-- Custom Sections (Below Family) -->
                        <h3 class="h5 fw-bold text-brown mb-3">વધારાની વિગતો (કુટુંબ નીચે)</h3>
                        <div id="customSectionsContainer" class="mb-3">
                            <!-- Sections dynamically rendered by JS -->
                        </div>
                        <button id="addCustomSectionBtn" class="btn btn-outline-secondary btn-sm mb-3">+ વિભાગ ઉમેરો
                            (નીચે)</button>

                        <hr class="my-4">

                        <!-- Advanced Styling Options Toggle -->
                        <div class="form-check form-switch mb-4">
                            <input class="form-check-input" type="checkbox" id="toggleAdvancedStyling">
                            <label class="form-check-label fw-bold text-brown" for="toggleAdvancedStyling">એડવાન્સ્ડ
                                સ્ટાઇલ વિકલ્પો</label>
                        </div>

                        <!-- Container for Advanced Styling Options, hidden by default -->
                        <div id="advancedStylingOptions" class="card p-3 bg-light hidden">
                            <h4 class="h6 fw-bold text-brown mb-3">કાર્ડ બેકગ્રાઉન્ડ</h4>
                            <div class="mb-3">
                                <label for="cardBackgroundColor" class="form-label">બેકગ્રાઉન્ડ રંગ:</label>
                                <input type="color" class="form-control form-control-color" id="cardBackgroundColor"
                                    value="#fdf5e6">
                            </div>
                        </div> <!-- End Advanced Styling Options -->

                        <hr class="my-4">

                        <div class="d-grid gap-2">
                            <button id="generateBtn" class="btn btn-primary btn-lg custom-btn-brown">કાર્ડ
                                બનાવો</button>
                            <button id="downloadBtn" class="btn btn-success btn-lg custom-btn-green">ડાઉનલોડ કરો
                                (Image)</button>
                        </div>

                    </div> <!-- End controls-form -->
                </div> <!-- End card -->
            </div> <!-- End col-lg-6 for controls -->

            <!-- Tribute Card Preview Column -->
            <div class="col-lg-6">
                <div class="tribute-card-wrapper">
                    <div class="tribute-card shadow-lg" id="tributeCard">
                        <!-- Background and Borders (handled by CSS background-image) -->

                        <div class="occasion-title" id="displayOccasion"></div>

                        <div class="photo-container-box">
                            <img src="./assets/img/photo-lft.png" class="photo-ornament" alt="ડેકોરેટિવ" />
                            <div class="photo-container">
                                <img id="displayPhoto" src="./assets/img/placeholder.png" alt="ફોટો">
                            </div>
                            <img src="./assets/img/photo-rgt.png" class="photo-ornament" alt="ડેકોરેટિવ" />
                        </div>

                        <div class="deceased-info">
                            <p class="deceased-name" id="displayDeceasedName"></p>
                            <p class="deceased-date-place" id="displayDatePlace"></p>
                        </div>

                        <div class="message-section" id="displayMessageSection">
                            <!-- Messages injected here by JS -->
                        </div>

                        <!-- Upper Custom Sections rendered above family -->
                        <div class="custom-sections-area" id="displayUpperCustomSections">
                            <!-- Upper custom sections injected here by JS -->
                        </div>

                        <div class="family-section">
                            <p class="family-heading" id="displayFamilyHeading">॥ લિ. ॥</p>
                            <div class="family-names-layout" id="displayFamilyNamesLayout">
                                <!-- Family names injected here by JS -->
                            </div>
                        </div>

                        <!-- Custom Sections rendered below family -->
                        <div class="custom-sections-area" id="displayCustomSections">
                            <!-- Custom sections injected here by JS -->
                        </div>

                    </div> <!-- End tribute-card -->
                </div> <!-- End tribute-card-wrapper -->
            </div> <!-- End col-lg-6 for preview -->
        </div> <!-- End row -->
    </div> <!-- End container-fluid -->

    <!-- Bootstrap JS (Popper included) -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"
        integrity="sha384-YvpcrYf0tY3lHB60NNkmXc5s9fDVZLESaAA55NDzOxhy9GkcIdslK1eN7N6jIeHz"
        crossorigin="anonymous"></script>
    <!-- Include html2canvas library for downloading the card as an image -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
    <!-- Custom JS -->
    <script src="./assets/js/script.js"></script>
</body>

</html>
